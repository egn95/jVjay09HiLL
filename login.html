<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login â€” AKTA IAT</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">

  <div class="auth-wrapper">
    <!-- Left Panel -->
    <div class="auth-panel left-panel">
      <div class="brand">
        <div class="brand-logo">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
            <rect width="48" height="48" rx="12" fill="white" fill-opacity="0.15"/>
            <path d="M24 8L38 32H10L24 8Z" fill="white" fill-opacity="0.9"/>
            <circle cx="24" cy="34" r="6" fill="white"/>
          </svg>
        </div>
        <h1 class="brand-name">AKTA IAT</h1>
        <p class="brand-tagline">Sistem Manajemen Terpadu</p>
      </div>
      <div class="panel-art">
        <div class="circle c1"></div>
        <div class="circle c2"></div>
        <div class="circle c3"></div>
      </div>
    </div>

    <!-- Right Panel â€” Login Form -->
    <div class="auth-panel right-panel">
      <div class="form-card">
        <div class="form-header">
          <h2>Selamat Datang</h2>
          <p>Masuk ke akun Anda untuk melanjutkan</p>
        </div>

        <form id="loginForm" novalidate>
          <!-- Alert -->
          <div id="alertBox" class="alert hidden"></div>

          <!-- Username -->
          <div class="field-group">
            <label for="username">Username</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                  <circle cx="12" cy="7" r="4"/>
                </svg>
              </span>
              <input
                type="text"
                id="username"
                name="username"
                placeholder="Masukkan username"
                autocomplete="username"
              />
            </div>
            <span class="field-error" id="usernameError"></span>
          </div>

          <!-- Password -->
          <div class="field-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Masukkan password"
                autocomplete="current-password"
              />
              <button type="button" class="toggle-password" id="togglePassword" aria-label="Tampilkan password">
                <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="eye-closed hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
            <span class="field-error" id="passwordError"></span>
          </div>

          <!-- Remember Me -->
          <div class="form-options">
            <label class="checkbox-label">
              <input type="checkbox" id="rememberMe" />
              <span class="checkmark"></span>
              Ingat saya
            </label>
          </div>

          <!-- Submit -->
          <button type="submit" class="btn-primary" id="submitBtn">
            <span class="btn-text">Masuk</span>
            <span class="btn-spinner hidden"></span>
          </button>
        </form>

        <div class="form-footer">
          <p class="hint-text">Demo: gunakan <strong>admin / admin123</strong></p>
        </div>
      </div>
    </div>
  </div>

  <script src="api.js?v=20260609w"></script>
  <script src="auth.js?v=20260609w"></script>
</body>
</html>
